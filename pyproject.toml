[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jiuge-training"
version = "0.1.0"
description = "Pinned Megatron training and explicit operator backends for Jiuge models"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
jiuge = "jiuge_training.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 79
target-version = ["py311"]
skip-string-normalization = true
